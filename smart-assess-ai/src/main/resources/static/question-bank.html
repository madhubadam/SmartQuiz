<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank - SmartAssess AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <a href="faculty-dashboard.html" class="brand">
                <div class="brand-icon">⚡</div>
                SmartQuiz-BVCE
            </a>
            <ul class="nav-links">
                <li class="nav-item"><a href="faculty-dashboard.html">📊 Dashboard</a></li>
                <li class="nav-item"><a href="question-generator.html">✨ AI Generator</a></li>
                <li class="nav-item active"><a href="question-bank.html">📚 Question Bank</a></li>
                <li class="nav-item"><a href="create-assessment.html">📝 New Assessment</a></li>
                <li class="nav-item"><a href="analytics.html">📈 Class Analytics</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-navbar">
                <h2 style="font-weight: 700; font-size: 1.25rem;">Question Repository Bank</h2>
                <div class="user-profile">
                    <span class="user-badge" id="user-role-display">FACULTY</span>
                    <span id="user-name-display" style="font-weight: 600;">Dr. Sarah Jenkins</span>
                    <button class="btn btn-secondary" onclick="logout()" style="padding:0.4rem 0.8rem; font-size:0.85rem;">Logout</button>
                </div>
            </header>

            <div class="content-body">
                <!-- Filters & Search Bar -->
                <div class="card" style="margin-bottom:1.5rem;">
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap:1rem; align-items:end;">
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Search Text</label>
                            <input type="text" id="filter-query" class="form-control" placeholder="Search questions..." onkeyup="filterQuestions()">
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Subject</label>
                            <select id="filter-subject" class="form-control" onchange="filterQuestions()">
                                <option value="">All Subjects</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Difficulty</label>
                            <select id="filter-difficulty" class="form-control" onchange="filterQuestions()">
                                <option value="">All Difficulties</option>
                                <option value="EASY">EASY</option>
                                <option value="MEDIUM">MEDIUM</option>
                                <option value="HARD">HARD</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Source</label>
                            <select id="filter-source" class="form-control" onchange="filterQuestions()">
                                <option value="">All Sources</option>
                                <option value="AI">AI Generated</option>
                                <option value="MANUAL">Manual</option>
                            </select>
                        </div>
                        <div>
                            <button class="btn btn-primary" style="width:100%;" onclick="openCreateModal()">+ Create Question</button>
                        </div>
                    </div>
                </div>

                <!-- Questions List Container -->
                <div id="questions-container" style="display:flex; flex-direction:column; gap:1rem;">
                    <!-- Question items populated here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Create / Edit Question Modal -->
    <div id="question-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:999; align-items:center; justify-content:center; padding:1rem;">
        <div class="card" style="width:100%; max-width:600px; max-height:90vh; overflow-y:auto;">
            <h3 id="modal-title" style="margin-bottom:1rem; font-size:1.2rem;">Create New Question</h3>
            <form id="modal-form">
                <input type="hidden" id="modal-q-id">
                <div class="form-group">
                    <label>Subject</label>
                    <select id="modal-subject" class="form-control" required></select>
                </div>
                <div class="form-group">
                    <label>Question Text</label>
                    <textarea id="modal-text" class="form-control" rows="3" required></textarea>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
                    <div class="form-group"><label>Option A</label><input type="text" id="modal-optA" class="form-control" required></div>
                    <div class="form-group"><label>Option B</label><input type="text" id="modal-optB" class="form-control" required></div>
                    <div class="form-group"><label>Option C</label><input type="text" id="modal-optC" class="form-control" required></div>
                    <div class="form-group"><label>Option D</label><input type="text" id="modal-optD" class="form-control" required></div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;">
                    <div class="form-group">
                        <label>Correct Answer</label>
                        <select id="modal-ans" class="form-control">
                            <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Difficulty</label>
                        <select id="modal-diff" class="form-control">
                            <option value="EASY">EASY</option><option value="MEDIUM" selected>MEDIUM</option><option value="HARD">HARD</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Explanation</label>
                    <input type="text" id="modal-exp" class="form-control" placeholder="Explanation for correct answer">
                </div>
                <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1rem;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Question</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        checkAuth('FACULTY');
        let allQuestions = [];
        let allSubjects = [];

        document.addEventListener('DOMContentLoaded', async () => {
            allSubjects = await apiFetch('/api/subjects');
            if (allSubjects) {
                const subSelect = document.getElementById('filter-subject');
                const modalSub = document.getElementById('modal-subject');
                allSubjects.forEach(s => {
                    subSelect.appendChild(new Option(s.name, s.id));
                    modalSub.appendChild(new Option(s.name, s.id));
                });
            }
            loadQuestions();
        });

        async function loadQuestions() {
            allQuestions = await apiFetch('/api/questions');
            renderQuestionList(allQuestions);
        }

        function filterQuestions() {
            const query = document.getElementById('filter-query').value.toLowerCase();
            const subjectId = document.getElementById('filter-subject').value;
            const diff = document.getElementById('filter-difficulty').value;
            const src = document.getElementById('filter-source').value;

            const filtered = allQuestions.filter(q => {
                if (query && !q.questionText.toLowerCase().includes(query)) return false;
                if (subjectId && String(q.subject.id) !== String(subjectId)) return false;
                if (diff && q.difficulty !== diff) return false;
                if (src && q.source !== src) return false;
                return true;
            });

            renderQuestionList(filtered);
        }

        function renderQuestionList(questions) {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            if (!questions || questions.length === 0) {
                container.innerHTML = `<div class="card" style="text-align:center; padding:3rem; color:var(--text-muted);">No matching questions found in Question Bank.</div>`;
                return;
            }

            questions.forEach(q => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.75rem;">
                        <div>
                            <span class="badge" style="background:rgba(79,70,229,0.15); color:var(--primary); margin-right:0.5rem;">${q.subject ? q.subject.name : 'General'}</span>
                            <span class="badge badge-${q.difficulty.toLowerCase()}">${q.difficulty}</span>
                            <span class="badge" style="background:rgba(255,255,255,0.08); color:var(--text-secondary); margin-left:0.5rem;">${q.source}</span>
                        </div>
                        <div>
                            <button class="btn btn-secondary" onclick="editQuestion(${q.id})" style="padding:0.3rem 0.6rem; font-size:0.8rem;">Edit</button>
                            <button class="btn btn-danger" onclick="deleteQuestion(${q.id})" style="padding:0.3rem 0.6rem; font-size:0.8rem;">Delete</button>
                        </div>
                    </div>

                    <h4 style="font-size:1rem; font-weight:600; margin-bottom:0.75rem;">${q.questionText}</h4>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; font-size:0.88rem; color:var(--text-secondary);">
                        <div style="${q.correctAnswer === 'A' ? 'color:var(--success); font-weight:bold;' : ''}">A: ${q.optionA}</div>
                        <div style="${q.correctAnswer === 'B' ? 'color:var(--success); font-weight:bold;' : ''}">B: ${q.optionB}</div>
                        <div style="${q.correctAnswer === 'C' ? 'color:var(--success); font-weight:bold;' : ''}">C: ${q.optionC}</div>
                        <div style="${q.correctAnswer === 'D' ? 'color:var(--success); font-weight:bold;' : ''}">D: ${q.optionD}</div>
                    </div>

                    ${q.explanation ? `<p style="margin-top:0.75rem; font-size:0.82rem; color:var(--text-muted); border-top:1px solid var(--border-color); padding-top:0.5rem;">💡 <strong>Explanation:</strong> ${q.explanation}</p>` : ''}
                `;
                container.appendChild(card);
            });
        }

        function openCreateModal() {
            document.getElementById('modal-title').innerText = 'Create New Question';
            document.getElementById('modal-q-id').value = '';
            document.getElementById('modal-form').reset();
            document.getElementById('question-modal').style.display = 'flex';
        }

        function editQuestion(id) {
            const q = allQuestions.find(item => item.id === id);
            if (!q) return;

            document.getElementById('modal-title').innerText = 'Edit Question';
            document.getElementById('modal-q-id').value = q.id;
            document.getElementById('modal-subject').value = q.subject.id;
            document.getElementById('modal-text').value = q.questionText;
            document.getElementById('modal-optA').value = q.optionA;
            document.getElementById('modal-optB').value = q.optionB;
            document.getElementById('modal-optC').value = q.optionC;
            document.getElementById('modal-optD').value = q.optionD;
            document.getElementById('modal-ans').value = q.correctAnswer;
            document.getElementById('modal-diff').value = q.difficulty;
            document.getElementById('modal-exp').value = q.explanation || '';

            document.getElementById('question-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('question-modal').style.display = 'none';
        }

        document.getElementById('modal-form').onsubmit = async (e) => {
            e.preventDefault();
            const qId = document.getElementById('modal-q-id').value;
            const body = {
                subjectId: parseInt(document.getElementById('modal-subject').value, 10),
                questionText: document.getElementById('modal-text').value,
                optionA: document.getElementById('modal-optA').value,
                optionB: document.getElementById('modal-optB').value,
                optionC: document.getElementById('modal-optC').value,
                optionD: document.getElementById('modal-optD').value,
                correctAnswer: document.getElementById('modal-ans').value,
                difficulty: document.getElementById('modal-diff').value,
                explanation: document.getElementById('modal-exp').value,
                approved: true
            };

            try {
                if (qId) {
                    await apiFetch(`/api/questions/${qId}`, { method: 'PUT', body: JSON.stringify(body) });
                    showToast('Question updated successfully', 'success');
                } else {
                    await apiFetch('/api/questions', { method: 'POST', body: JSON.stringify(body) });
                    showToast('Question created successfully', 'success');
                }
                closeModal();
                loadQuestions();
            } catch (err) {
                console.error(err);
            }
        };

        async function deleteQuestion(id) {
            if (!confirm('Are you sure you want to delete this question?')) return;
            try {
                await apiFetch(`/api/questions/${id}`, { method: 'DELETE' });
                showToast('Question deleted', 'info');
                loadQuestions();
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
